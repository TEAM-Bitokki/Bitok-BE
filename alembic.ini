[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Keep this file ASCII only. Alembic reads it with the system locale encoding,
# so non-ASCII text breaks on Windows (cp949).

# Left empty on purpose. alembic/env.py fills it from DATABASE_URL.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
