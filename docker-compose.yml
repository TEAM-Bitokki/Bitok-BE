services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bitok
      POSTGRES_PASSWORD: bitok
      POSTGRES_DB: bitok
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitok"]
      interval: 5s

volumes:
  pgdata:
