services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bitok}
      POSTGRES_DB: bitok
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitok"]
      interval: 5s

volumes:
  pgdata:
