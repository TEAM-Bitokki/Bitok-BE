name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bitok
          POSTGRES_PASSWORD: bitok
          POSTGRES_DB: bitok_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bitok"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: 계약 테스트
        run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bitok:bitok@localhost:5432/bitok_test
